<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>All Along</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: black;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
}

button {
    width: 300px;
    height: 120px;
    font-size: 40px;
    cursor: pointer;
}
</style>
</head>

<body>

<button id="playButton">PLAY</button>

<audio id="song" preload="auto">
    <source src="All%20Along%20%281%29.mp3" type="audio/mpeg">
</audio>

<script>
const song = document.getElementById("song");
const button = document.getElementById("playButton");

button.addEventListener("click", function() {
    if (song.paused) {
        song.play();
        button.innerHTML = "STOP";
    } else {
        song.pause();
        song.currentTime = 0;
        button.innerHTML = "PLAY";
    }
});
</script>

</body>
</html>
