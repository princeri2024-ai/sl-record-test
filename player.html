<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>All Along</title>

<style>
    html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: black;
    }

    body {
        display: flex;
        justify-content: center;
        align-items: center;
    }

    #status {
        color: white;
        font-family: Arial, sans-serif;
        font-size: 30px;
    }
</style>
</head>

<body>

<div id="status">READY</div>

<audio id="song" preload="auto">
    <source src="All%20Along%20%281%29.mp3" type="audio/mpeg">
</audio>

<script>

const song = document.getElementById("song");
const status = document.getElementById("status");

const params = new URLSearchParams(window.location.search);
const action = params.get("action");


// PLAY COMMAND
if (action === "play")
{
    status.innerHTML = "PLAYING...";

    song.currentTime = 0;
    song.volume = 1.0;

    song.play()
        .then(() => {
            status.innerHTML = "PLAYING";
        })
        .catch((error) => {
            status.innerHTML = "PLAY BLOCKED";
            console.log(error);
        });
}


// STOP COMMAND
else if (action === "stop")
{
    song.pause();
    song.currentTime = 0;

    status.innerHTML = "STOPPED";
}


// NO COMMAND
else
{
    status.innerHTML = "READY";
}

</script>

</body>
</html>
